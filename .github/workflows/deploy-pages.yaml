name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Read the runner UID/GID
        id: runner-user
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build the WebAssembly toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: modern-robotics-wasm:pages
          load: true
          build-args: |
            USER_UID=${{ steps.runner-user.outputs.uid }}
            USER_GID=${{ steps.runner-user.outputs.gid }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build WebAssembly
        run: |
          docker run --rm \
            -v "${PWD}:/home/robotics/modern-robotics-wasm" \
            -w /home/robotics/modern-robotics-wasm \
            modern-robotics-wasm:pages \
            scripts/build_wasm.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build static web application
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4